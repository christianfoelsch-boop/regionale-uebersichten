<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Ü50 Druckliste</title>
<style>
:root{--red:#8f1d1d;--line:#cfd5dc;--muted:#5d6772}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:#151a20;font-family:Arial,Helvetica,sans-serif}
.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:10mm 11mm;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.screenbar{width:210mm;margin:12px auto;display:flex;gap:8px;flex-wrap:wrap}
.screenbar a,.screenbar button{border:0;border-radius:8px;padding:9px 11px;font:inherit;font-weight:700;background:#fff;color:var(--red);text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.08);cursor:pointer}
header{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border-bottom:2px solid var(--red);padding-bottom:5mm;margin-bottom:5mm}
h1{font-size:17pt;line-height:1.1;margin:0;color:var(--red)}
.sub{font-size:9pt;color:var(--muted);margin-top:2mm}
.meta{font-size:8.5pt;text-align:right;color:var(--muted);line-height:1.35}
.notice{font-size:8.5pt;border:1px solid #edd39a;background:#fff8dc;padding:2mm 3mm;margin-bottom:4mm}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
th,td{border:1px solid var(--line);padding:1.7mm 2mm;vertical-align:middle}
th{background:#f3e7e7;color:#3d1212;text-align:left}
tbody tr:nth-child(even){background:#fafafa}
.nr{width:18mm}.date{width:26mm}.time{width:17mm}.home,.away{width:auto}.mark{width:21mm}
.focus{font-weight:700;color:var(--red)}
.small{font-size:8pt;color:var(--muted)}
footer{margin-top:5mm;border-top:1px solid var(--line);padding-top:2mm;font-size:8pt;color:var(--muted);display:flex;justify-content:space-between;gap:8mm}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .screenbar{display:none}
  .sheet{width:auto;min-height:auto;margin:0;padding:9mm 10mm;box-shadow:none}
  h1{font-size:16pt}.sub,.meta,.notice,footer{font-size:8pt}
  table{font-size:8.5pt}
  th,td{padding:1.35mm 1.7mm}
}
@media(max-width:800px){.screenbar,.sheet{width:auto;margin:8px}.sheet{min-height:0;padding:14px;overflow:auto}table{min-width:760px}}
</style>
</head><body>
<nav class="screenbar"><a href="./">Zurück zur Ü50-Seite</a><a href="druck.html?typ=wittenberge">Wittenberge</a><a href="druck.html?typ=staffel">Gesamte Staffel</a><button onclick="window.print()">Drucken</button></nav>
<main class="sheet">
<header><div><h1 id="title">Ü50 Druckliste</h1><div class="sub" id="subtitle"></div></div><div class="meta" id="meta"></div></header>
<div class="notice" id="notice"></div>
<table aria-label="Druckliste"><thead><tr><th class="nr">Nr.</th><th class="date">Datum</th><th class="time">Zeit</th><th class="home">Heim</th><th class="away">Gast</th><th class="mark">Ergebnis</th></tr></thead><tbody id="rows"></tbody></table>
<footer><span id="source"></span><span>Private Übersicht · Ausdruck A4</span></footer>
</main>
<script>
const fallbackData={"competition":"Altsenioren Ü50 Staffel A","league":"Herren Ü50 Kreisliga","season":"2026/2027","staffelId":"610639","focusTeam":"wittenberge","provisional":true,"updated":"2026-09-02","source":{"label":"FUSSBALL.DE","leagueUrl":"https://www.fussball.de/spielplan/altsenioren-ue50-staffel-a-kreis-prignitz-ruppin-herren-ue50-kreisliga-herren-ue50-saison2627-brandenburg/-/staffel/031NO685S4000007VS5489BUVT2M8LCU-G","teamUrl":"https://www.fussball.de/mannschaft/spg-veritas-esv-wittenberge-fsv-veritas-wittenberge-breese-brandenburg/-/saison/2627/team-id/02PGHIM4A4000000VS5489B1VSCT0UPQ"},"teams":[{"id":"wittenberge","name":"SpG Veritas/ESV Wittenberge","short":"Wittenberge"},{"id":"pritzwalk","name":"Pritzwalker FHV","short":"Pritzwalk"},{"id":"karstaedt","name":"SC Hertha Karstädt","short":"Karstädt"},{"id":"perleberg","name":"SSV Einheit Perleberg","short":"Perleberg"},{"id":"blumenthal","name":"SV Blumenthal-Grabow (Ü50)","short":"Blumenthal"}],"games":[{"nr":"610639001","date":"2026-10-14","time":"19:00","home":"pritzwalk","away":"karstaedt"},{"nr":"610639002","date":"2026-09-02","time":"18:30","home":"wittenberge","away":"perleberg","result":"3:0","status":"finished"},{"nr":"610639005","date":"2026-09-09","time":"19:00","home":"blumenthal","away":"pritzwalk"},{"nr":"610639006","date":"2026-09-09","time":"18:30","home":"karstaedt","away":"wittenberge"},{"nr":"610639007","date":"2026-09-16","time":"19:00","home":"pritzwalk","away":"wittenberge"},{"nr":"610639008","date":"2026-09-16","time":"19:00","home":"blumenthal","away":"perleberg"},{"nr":"610639010","date":"2026-09-30","time":"19:00","home":"pritzwalk","away":"perleberg"},{"nr":"610639012","date":"2026-09-30","time":"18:30","home":"karstaedt","away":"blumenthal"},{"nr":"610639013","date":"2026-10-07","time":"19:00","home":"perleberg","away":"karstaedt"},{"nr":"610639014","date":"2026-10-07","time":"19:00","home":"blumenthal","away":"wittenberge"},{"nr":"610639016","date":"2027-04-21","time":"18:30","home":"karstaedt","away":"pritzwalk"},{"nr":"610639017","date":"2027-04-21","time":"19:00","home":"perleberg","away":"wittenberge"},{"nr":"610639020","date":"2027-04-28","time":"19:00","home":"pritzwalk","away":"blumenthal"},{"nr":"610639021","date":"2027-04-28","time":"18:30","home":"wittenberge","away":"karstaedt"},{"nr":"610639022","date":"2027-05-19","time":"18:30","home":"wittenberge","away":"pritzwalk"},{"nr":"610639023","date":"2027-05-19","time":"19:00","home":"perleberg","away":"blumenthal"},{"nr":"610639025","date":"2027-05-26","time":"19:00","home":"perleberg","away":"pritzwalk"},{"nr":"610639027","date":"2027-05-26","time":"19:00","home":"blumenthal","away":"karstaedt"},{"nr":"610639028","date":"2027-06-02","time":"18:30","home":"karstaedt","away":"perleberg"},{"nr":"610639029","date":"2027-06-02","time":"18:30","home":"wittenberge","away":"blumenthal"}]};
let data=fallbackData;const type=new URLSearchParams(location.search).get("typ")==="staffel"?"staffel":"wittenberge";
function E(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function team(id){return (data.teams||[]).find(t=>t.id===id)||{id,name:id,short:id}}
function dt(g){return (g.date||"")+(g.time||"")}
function fmtDate(s){return new Date(s+"T00:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}
function isFocus(g){return g.home===data.focusTeam||g.away===data.focusTeam}
function render(){
  const games=[...(data.games||[])].filter(g=>type==="staffel"||isFocus(g)).sort((a,b)=>dt(a).localeCompare(dt(b)));
  document.title=type==="staffel"?"Ü50 Druckliste Staffel":"Ü50 Druckliste Wittenberge";
  document.getElementById("title").textContent=type==="staffel"?"Ü50 Gesamtspielplan":"Ü50 Spielplan Wittenberge";
  document.getElementById("subtitle").textContent=`${data.competition} · ${data.season}`;
  document.getElementById("meta").innerHTML=`Stand: ${E(data.updated)}<br>${games.length} Spiele<br>${data.provisional?"Spielplan vorläufig":"Spielplan bestätigt"}`;
  document.getElementById("notice").textContent=type==="staffel"?"Druckliste der gesamten Staffel. Ergebnisse können handschriftlich ergänzt werden.":"Druckliste der Spiele mit SpG Veritas/ESV Wittenberge. Ergebnisse können handschriftlich ergänzt werden.";
  document.getElementById("source").textContent=`Quelle: ${data.source?.label||"FUSSBALL.DE"}`;
  document.getElementById("rows").innerHTML=games.map(g=>{
    const h=team(g.home),a=team(g.away),hf=g.home===data.focusTeam,af=g.away===data.focusTeam;
    return `<tr><td>${E(g.nr||"")}</td><td>${fmtDate(g.date)}</td><td>${E(g.time||"")}</td><td class="${hf?"focus":""}">${E(h.short)}</td><td class="${af?"focus":""}">${E(a.short)}</td><td>${E(g.result||"")}</td></tr>`;
  }).join("");
}
async function load(){try{const r=await fetch("ue50-spiele.json?"+Date.now(),{cache:"no-store"});data=await r.json()}catch(e){data=fallbackData}render()}
load();
</script>
</body></html>
