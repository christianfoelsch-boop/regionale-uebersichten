name: Daten aktualisieren und GitHub Pages veröffentlichen

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 6,11,16,20,23 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Aktuellen main-Stand holen
        run: git pull --ff-only origin main

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Angebotsdaten aktualisieren
        continue-on-error: true
        run: python3 scripts/update_angebote.py

      - name: Fußballdaten aktualisieren
        continue-on-error: true
        run: python3 scripts/update_fussball.py

      - name: Aktualisierte JSON-Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angebote/angebote.json fussball/spiele.json
          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "Daten automatisch aktualisiert"
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi

      - name: Veröffentlichungsordner erstellen
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html impressum.html datenschutz.html quellen.html robots.txt .nojekyll _site/
          cp -r assets angebote fussball ue50 _site/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
